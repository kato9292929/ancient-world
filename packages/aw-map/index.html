<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>遺跡年代マップ — ancient world</title>
    <meta name="description" content="年代スライダー付きの世界地図に、遺跡をピンで置く。" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="page-head">
      <h1>遺跡年代マップ</h1>
      <p class="lede">
        年代スライダーで、その時点までに成立した遺跡を絞る。座標が確定した地点だけをピンで置く。
        座標が未取得・所在未特定の地点は、左の一覧に残す。
      </p>
    </header>
    <main class="layout">
      <aside class="col-left" aria-label="クラスタ一覧">
        <div id="clusters"></div>
      </aside>
      <section class="col-center">
        <div id="map" class="map-wrap"></div>
        <div class="slider-row">
          <label for="year-slider">年代</label>
          <input id="year-slider" type="range" aria-describedby="year-label" />
          <output id="year-label" class="year-label"></output>
          <span id="pin-count" class="pin-count"></span>
        </div>
      </section>
      <aside class="col-right" aria-label="詳細">
        <div id="detail"></div>
      </aside>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
